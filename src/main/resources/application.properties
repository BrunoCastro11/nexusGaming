spring.application.name=nexus

# Carga las variables desde un archivo .env en la raíz del proyecto (opcional, no se sube a Git)
spring.config.import=optional:file:.env[.properties]

# --- Conexión a Neon (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://ep-shy-cloud-b6go78z1.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_bqrFDdi6BA9V
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon suspende la base tras un rato sin uso: la primera conexión puede demorar
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=8080

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- JWT ---
jwt.secret=7f9a2b4e8c1d6f3a0e5b9c4d2a8f7e1b
jwt.access-ttl-seconds=900
jwt.refresh-ttl-seconds=604800

# --- CORS (orígenes del frontend separados por coma) ---
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
